<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ditt julklappspaket</title>
<meta property="og:title" content="Ditt julklappspaket">
<meta property="og:description" content="Öppna länken när ingen tittar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10261d;
    --text: #f4ecdc;
    --dampad: #b8c2b3;
    --rod: #b8322b;
    --rod-hover: #c93c34;
    --guld: #d9b56a;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 17px;
    font-weight: 400;
    line-height: 1.55;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  #sno { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  .sida {
    position: relative;
    z-index: 1;
    max-width: 460px;
    margin: 0 auto;
    padding: 9vh 16px 48px;
    text-align: center;
  }
  h1 { font-family: var(--serif); font-weight: 600; line-height: 1.1; margin: 0; font-size: clamp(2.2rem, 10vw, 3rem); }
  p { margin: 10px 0 0; }
  .overst { margin: 0 0 14px; color: var(--dampad); font-size: 0.95rem; }
  .hej-text { color: var(--dampad); }

  .knapp {
    font: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    color: #fff;
    background: var(--rod);
    border: 0;
    border-radius: 4px;
    padding: 14px 30px;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .knapp:hover { background: var(--rod-hover); }
  .lank {
    font: inherit;
    font-size: 0.95rem;
    color: var(--dampad);
    background: none;
    border: 0;
    padding: 10px 6px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .lank:hover { color: var(--text); }
  :focus-visible { outline: 2px solid var(--guld); outline-offset: 3px; }
  [hidden] { display: none !important; }

  .gava { display: block; width: 200px; max-width: 60vw; height: auto; margin: 48px auto 0; overflow: visible; }
  .gava .lock {
    transform-box: fill-box;
    transform-origin: 0% 100%;
    transition: transform 0.7s cubic-bezier(0.34, 1.5, 0.6, 1);
  }
  .gava .stjarna { opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(0.3); transition: opacity 0.4s 0.3s, transform 0.5s 0.3s; }
  .oppnad .gava .lock { transform: translate(-4px, -30px) rotate(-18deg); }
  .oppnad .gava .stjarna { opacity: 1; transform: scale(1); }
  .gava.skaka { animation: skaka 0.6s ease-in-out 0.4s; transform-origin: 50% 100%; }
  @keyframes skaka {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-4deg); }
    40% { transform: rotate(3.5deg); }
    60% { transform: rotate(-2.5deg); }
    80% { transform: rotate(1.5deg); }
  }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .avslojat { margin-top: 20px; }
  .oppnad .avslojat { animation: in 0.5s 0.35s ease-out both; }
  .avslojat p { margin: 0; color: var(--dampad); }
  .avslojat .mottagare {
    margin: 2px 0 0;
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(2.8rem, 14vw, 3.8rem);
    line-height: 1.1;
    color: var(--guld);
  }
  .knappar { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 26px; }
  .inte-du { margin-top: 18px; font-size: 0.9rem; color: var(--dampad); }
  .kod { margin-top: 48px; font-size: 0.8rem; color: var(--dampad); opacity: 0.75; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<canvas id="sno" aria-hidden="true"></canvas>

<main class="sida">
  <section id="paket" hidden>
    <p class="overst" id="overst">Julklappslottning</p>
    <h1 id="hej">Hej!</h1>
    <p class="hej-text" id="hejText">Här är ditt paket. Se till att ingen tittar över axeln.</p>

    <svg class="gava" id="gava" viewBox="0 0 200 172" aria-hidden="true">
      <g class="stjarna" fill="#d9b56a"><path d="M38 40 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/></g>
      <g class="stjarna" fill="#f4ecdc"><path d="M160 22 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4z"/></g>
      <g class="stjarna" fill="#d9b56a"><path d="M176 64 l2 4.6 4.6 2 -4.6 2 -2 4.6 -2 -4.6 -4.6 -2 4.6 -2z"/></g>
      <rect x="32" y="74" width="136" height="94" rx="3" fill="#a92d27"/>
      <rect x="32" y="74" width="136" height="7" fill="#6e1c18"/>
      <rect x="89" y="74" width="22" height="94" fill="#d9b56a"/>
      <rect x="89" y="74" width="22" height="7" fill="#a8873f"/>
      <g class="lock">
        <path d="M100 48 C 88 16, 54 16, 60 37 C 64 50, 88 50, 100 48 Z" fill="#d9b56a"/>
        <path d="M100 48 C 112 16, 146 16, 140 37 C 136 50, 112 50, 100 48 Z" fill="#d9b56a"/>
        <path d="M100 48 C 90 30, 70 28, 70 37 C 72 44, 88 47, 100 48 Z" fill="#a8873f" opacity="0.55"/>
        <path d="M100 48 C 110 30, 130 28, 130 37 C 128 44, 112 47, 100 48 Z" fill="#a8873f" opacity="0.55"/>
        <rect x="24" y="48" width="152" height="30" rx="3" fill="#c53a32"/>
        <rect x="89" y="48" width="22" height="30" fill="#e3c27c"/>
        <circle cx="100" cy="47" r="8" fill="#c9a253"/>
      </g>
    </svg>

    <div class="avslojat" id="avslojat" hidden>
      <p>Du köper julklapp till</p>
      <p class="mottagare" id="mottagare"></p>
      <p id="mottagarFamilj"></p>
    </div>

    <div class="knappar">
      <button class="knapp" id="oppna" type="button">Öppna paketet</button>
      <button class="lank" id="stang" type="button" hidden>Stäng paketet igen</button>
    </div>
    <p class="inte-du" id="inteDu"></p>
  </section>

  <section id="fel" hidden>
    <h1>Länken fungerar inte</h1>
    <p class="hej-text">Den verkar inte ha kommit med hela vägen. Be den som lottade att skicka den igen.</p>
  </section>

  <p class="kod" id="kod"></p>
</main>

<script>
(function () {
  "use strict";
  const $ = function (id) { return document.getElementById(id); };

  // Samma talföljd som i lottningsfilen. Länken bär allt; sidan själv innehåller inga namn.
  function strom(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  function fran64(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    const bin = atob(s);
    const ut = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) ut[i] = bin.charCodeAt(i);
    return ut;
  }

  function avkoda(token) {
    const b = fran64(token);
    if (b.length < 6 || b[0] !== 1) throw new Error("okänd version");
    const seed = (b[1] | (b[2] << 8) | (b[3] << 16) | (b[4] << 24)) >>> 0;
    const r = strom(seed);
    const data = new Uint8Array(b.length - 5);
    for (let i = 0; i < data.length; i++) data[i] = b[5 + i] ^ (r() & 255);
    const obj = JSON.parse(new TextDecoder().decode(data));
    if (!obj || typeof obj.g !== "string" || typeof obj.t !== "string" || !obj.g || !obj.t) throw new Error("ofullständig");
    return obj;
  }

  let lapp = null;
  try {
    const token = decodeURIComponent(location.hash.replace(/^#/, "").trim());
    if (token) lapp = avkoda(token);
  } catch (e) { lapp = null; }

  if (!lapp) {
    $("fel").hidden = false;
    document.title = "Länken fungerar inte";
  } else {
    const paket = $("paket");
    paket.hidden = false;
    $("overst").textContent = "Julklappslottning " + (lapp.a || "");
    $("hej").textContent = "Hej " + lapp.g + "!";
    $("inteDu").textContent = "Är du inte " + lapp.g + "? Stäng sidan utan att öppna paketet.";
    if (lapp.k) $("kod").textContent = "Lottning " + lapp.k;
    document.title = "Paket till " + lapp.g;
    $("gava").classList.add("skaka");

    $("oppna").addEventListener("click", function () {
      $("mottagare").textContent = lapp.t;
      $("mottagarFamilj").textContent = lapp.f ? "i " + lapp.f : "";
      $("hejText").textContent = "Håll det hemligt till julafton.";
      $("avslojat").hidden = false;
      paket.classList.add("oppnad");
      $("oppna").hidden = true;
      $("stang").hidden = false;
      $("inteDu").hidden = true;
      $("stang").focus();
    });

    $("stang").addEventListener("click", function () {
      paket.classList.remove("oppnad");
      $("avslojat").hidden = true;
      $("mottagare").textContent = "";
      $("mottagarFamilj").textContent = "";
      $("hejText").textContent = "Paketet är stängt. Du kan öppna det igen när du vill.";
      $("oppna").hidden = false;
      $("stang").hidden = true;
      $("oppna").focus();
    });
  }

  // Snö
  (function () {
    const canvas = $("sno");
    const ctx = canvas.getContext("2d");
    const lugn = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let flingor = [], b = 0, h = 0;
    function ny(spridd) {
      const r = 0.8 + Math.random() * 2.2;
      return { x: Math.random() * b, y: spridd ? Math.random() * h : -5, r: r, v: 0.25 + r * 0.22,
        fas: Math.random() * Math.PI * 2, a: 0.25 + Math.random() * 0.5 };
    }
    function rita() {
      ctx.clearRect(0, 0, b, h);
      for (const f of flingor) {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(244, 236, 220, " + f.a + ")";
        ctx.fill();
      }
    }
    function storlek() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      b = window.innerWidth; h = window.innerHeight;
      canvas.width = b * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const antal = Math.min(90, Math.round(b * h / 16000));
      flingor = [];
      for (let i = 0; i < antal; i++) flingor.push(ny(true));
      if (lugn) rita();
    }
    function steg() {
      for (let i = 0; i < flingor.length; i++) {
        const f = flingor[i];
        f.fas += 0.01; f.y += f.v; f.x += Math.sin(f.fas) * 0.35;
        if (f.y > h + 5) flingor[i] = ny(false);
      }
      rita();
      requestAnimationFrame(steg);
    }
    window.addEventListener("resize", storlek);
    storlek();
    if (!lugn) requestAnimationFrame(steg);
  })();
})();
</script>
</body>
</html>
